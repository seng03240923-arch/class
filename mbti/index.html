<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관상 MBTI - 재미로 보는 나의 예상 MBTI</title>
<style>
/* 귀여운 둥근 글씨체: 인터넷 연결 시 Jua 폰트를 불러오고, 안 되면 기기 기본 글꼴을 사용해요. */
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--pink:#ff6fae;--deep:#e94c91;--pale:#fff0f7;--ink:#573448;--line:#ffd0e4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff5fa,#ffe4f0);font-family:"Jua","Nunito","Malgun Gothic",sans-serif;color:var(--ink);padding:22px;letter-spacing:.2px}
main{width:min(100%,560px);margin:0 auto}
.panel{background:#fff;border:2px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 14px 35px #d95b9220}
h1{text-align:center;font-size:clamp(30px,7.5vw,43px);margin:4px 0 8px;color:var(--deep);letter-spacing:1px;text-shadow:2px 3px 0 #ffe0ee}
.sub{text-align:center;margin:0 0 22px;color:#91677d}
.upload{display:grid;place-items:center;min-height:230px;border:2px dashed #f5a6ca;border-radius:22px;background:#fff8fb;overflow:hidden;position:relative}
.upload img{max-width:100%;max-height:300px;object-fit:contain;display:none}
.upload .placeholder{text-align:center;padding:20px}
.upload .emoji{font-size:56px}
input[type=file]{display:none}
label,.btn{min-height:54px;border:0;border-radius:18px;padding:13px 18px;font-family:inherit;font-size:19px;font-weight:800;letter-spacing:.3px;cursor:pointer;display:flex;align-items:center;justify-content:center}
label{background:#ffe0ee;color:#a63d70;margin:16px 0 10px}
.btn{width:100%;background:var(--pink);color:#fff;box-shadow:0 5px 0 #df4c91;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #df4c91}
.btn.secondary{background:#fff;color:var(--deep);border:2px solid var(--line);box-shadow:none}
.note{text-align:center;font-size:13px;color:#98788a;line-height:1.6;margin:16px 0 0}
.result{display:none;margin-top:22px;padding:22px;border-radius:22px;background:linear-gradient(140deg,#fff0f7,#fff9fc);border:2px solid var(--line);text-align:center}
.result .eyebrow{font-size:14px;color:#a56b86;font-weight:700}
.result h2{font-size:58px;letter-spacing:6px;color:var(--deep);margin:8px 0;text-shadow:2px 3px 0 #ffe0ee}
.result h3{margin:4px 0 12px;font-size:23px;letter-spacing:.3px}
.result p{line-height:1.7;margin:8px 0}
.tag{display:inline-block;background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:99px;margin:4px;font-size:13px}
.actions{display:flex;gap:10px;margin-top:12px}
.actions .btn{flex:1}
footer{text-align:center;font-size:12px;color:#9b7b8d;margin:16px 0}
@media(max-width:400px){body{padding:12px}.panel{padding:17px;border-radius:22px}.actions{flex-direction:column}}
@media print{body{background:#fff;padding:0}.panel{box-shadow:none}.upload,label,.actions,.note{display:none!important}.result{display:block!important}}
</style>
</head>
<body>
<main>
<section class="panel">
<h1>🎀 관상 MBTI 🎀</h1>
<p class="sub">사진 한 장으로 바로 보는 오늘의 재미 MBTI!</p>
<div class="upload" id="dropArea">
  <div class="placeholder" id="placeholder"><div class="emoji">📸</div><strong>내 사진을 올려주세요!</strong><p>사진은 이 기기 안에서만 처리돼요.</p></div>
  <img id="photo" alt="내가 선택한 사진 미리보기">
</div>
<label for="file">🖼️ 사진 선택하기</label>
<input id="file" type="file" accept="image/*">
<button class="btn" id="analyze" disabled>✨ 관상 MBTI 분석하기</button>
<div class="result" id="result" aria-live="polite">
  <div class="eyebrow">두근두근 오늘의 예상 MBTI</div>
  <h2 id="type">ENFP</h2>
  <h3 id="title">반짝반짝 아이디어 요정</h3>
  <p id="desc"></p>
  <div id="tags"></div>
  <p class="note">※ 사진을 바탕으로 만든 재미용 가상 결과예요. 실제 성격이나 MBTI를 알아내는 검사는 아니에요.</p>
  <div class="actions">
    <button class="btn secondary" id="again">다른 사진으로 다시 하기</button>
    <button class="btn" id="print">결과 인쇄하기</button>
  </div>
</div>
<p class="note">질문 없이 바로 결과가 나와요. 사진은 서버로 전송되지 않아요.</p>
</section>
<footer>관상 MBTI · 재미로만 즐겨주세요 💗</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const file=$('file'),photo=$('photo'),placeholder=$('placeholder'),analyze=$('analyze'),result=$('result');
const profiles=[
['ENFP','반짝반짝 아이디어 요정','호기심이 반짝! 새로운 재미를 찾아 나서는 상상력 대장 타입이에요.','호기심 뿜뿜','상상력 풍부','분위기 메이커'],
['ISTJ','차근차근 믿음직 대장','차분하고 야무진 느낌! 작은 일도 꼼꼼하게 해낼 것 같은 타입이에요.','꼼꼼함','약속 잘 지킴','든든한 친구'],
['ISFP','포근포근 감성 아티스트','부드럽고 따뜻한 분위기! 좋아하는 것을 자기만의 방식으로 즐기는 타입이에요.','감성 충만','다정다감','나만의 취향'],
['ENTJ','당당당당 리더 대장','자신감 넘치는 분위기! 목표를 정하면 멋지게 이끌어 갈 것 같은 타입이에요.','추진력','결단력','리더 기질'],
['INFP','몽글몽글 상상 탐험가','마음속에 멋진 이야기가 가득! 나만의 세계를 소중히 여기는 타입이에요.','풍부한 상상','따뜻한 마음','나만의 세계'],
['ESTP','에너지 팡팡 모험가','활기찬 느낌! 생각만 하기보다 직접 해보며 배우는 타입이에요.','도전 정신','순발력','행동파'],
['INFJ','조용한 반짝 통찰가','차분하지만 속은 깊은 느낌! 주변을 세심하게 살피는 타입이에요.','세심함','깊은 생각','공감 능력'],
['ESFJ','다정다감 행복 배달부','밝고 친근한 느낌! 친구들과 함께할 때 즐거움이 커지는 타입이에요.','친화력','배려심','팀워크']
];
let imageData='';
file.addEventListener('change',()=>{
 const f=file.files&&file.files[0]; if(!f)return;
 if(!f.type.startsWith('image/')){alert('이미지 파일을 선택해 주세요.');return;}
 const reader=new FileReader();
 reader.onload=()=>{imageData=reader.result;photo.src=imageData;photo.style.display='block';placeholder.style.display='none';analyze.disabled=false;result.style.display='none';};
 reader.readAsDataURL(f);
});
analyze.addEventListener('click',()=>{
 if(!imageData)return;
 // 사진의 색상·밝기에서 만든 간단한 숫자로 재미용 유형을 고릅니다. 얼굴이나 성격을 판별하지 않습니다.
 const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
 const img=new Image();
 img.onload=()=>{
  canvas.width=32;canvas.height=32;ctx.drawImage(img,0,0,32,32);
  const d=ctx.getImageData(0,0,32,32).data;let sum=0,bright=0;
  for(let i=0;i<d.length;i+=4){sum+=(d[i]*3+d[i+1]*5+d[i+2]*2);bright+=Math.max(d[i],d[i+1],d[i+2]);}
  const seed=Math.floor((sum+bright)%profiles.length),p=profiles[seed];
  $('type').textContent=p[0];$('title').textContent=p[1];$('desc').textContent=p[2];
  $('tags').innerHTML=p.slice(3).map(t=>'<span class="tag">'+t+'</span>').join('');
  result.style.display='block';result.scrollIntoView({behavior:'smooth',block:'nearest'});
 };
 img.src=imageData;
});
$('again').addEventListener('click',()=>{file.value='';imageData='';photo.removeAttribute('src');photo.style.display='none';placeholder.style.display='block';analyze.disabled=true;result.style.display='none';window.scrollTo({top:0,behavior:'smooth'});});
$('print').addEventListener('click',()=>window.print());
</script>
</body>
</html>
